<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ear Trainer</title>
<style>
  :root {
    --bg: #f6f5f2;
    --fg: #1d1d1f;
    --muted: #6b6b70;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18181a; --fg: #ececee; --muted: #9a9aa0; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 system-ui, "Segoe UI", sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  #debug { margin-top: 24px; padding: 12px 16px; border: 1px dashed var(--muted); border-radius: 8px; }
  #debug h2 { font-size: 1.1rem; margin: 0 0 8px; }
  #debug .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
  #debug button { font: inherit; padding: 4px 10px; min-width: 3em; }
</style>
</head>
<body>
<main>
  <h1>Ear Trainer</h1>
  <p class="muted">Phase 1 placeholder. The game is not yet available.</p>
  <p id="app">If you see this text, the script did not run.</p>
  <section id="debug" hidden>
    <h2>Audio debug</h2>
    <p class="muted">Check by ear: no clicks at note start or end, no distortion when notes overlap, A4 = 440 Hz on a tuner.</p>
    <div class="row">
      <label>Voice <select id="debug-voice"></select></label>
      <button type="button" id="debug-stop">Stop all</button>
      <span id="debug-state" class="muted"></span>
    </div>
    <div class="row" id="debug-notes"></div>
    <div class="row" id="debug-extra"></div>
  </section>
</main>
<script>
(() => {
'use strict';
// ---- music.js ----
// Pure note math. No DOM, no Web Audio.
// A note is a MIDI number: C4 = 60, A4 = 69.

const A4_MIDI = 69;
const A4_FREQ = 440;

const BLACK_PCS = [1, 3, 6, 8, 10];

const NAMES = {
  international: ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'],
  central: ['C', 'Cis', 'D', 'Dis', 'E', 'F', 'Fis', 'G', 'Gis', 'A', 'B', 'H'],
};

// Pitch class 0..11. Correct for negative input too.
const pitchClass = (midi) => ((midi % 12) + 12) % 12;

// Scientific octave number: C4 = 60.
const octaveOf = (midi) => Math.floor(midi / 12) - 1;

// 12-TET frequency in Hz.
const midiToFreq = (midi) => A4_FREQ * Math.pow(2, (midi - A4_MIDI) / 12);

const isBlack = (midi) => BLACK_PCS.includes(pitchClass(midi));

// style: 'central' (default) or 'international'.
const noteName = (midi, { style = 'central', showOctave = false } = {}) => {
  const table = NAMES[style];
  if (!table) throw new Error(`unknown naming style: ${style}`);
  const base = table[pitchClass(midi)];
  return showOctave ? `${base}${octaveOf(midi)}` : base;
};

// True when the range covers notes from more than one octave number.
const spansOctaves = (low, high) => octaveOf(low) !== octaveOf(high);

// Ascending list of MIDI numbers in [low, high].
const buildNoteSet = ({ low = 60, high = 84, whiteOnly = true } = {}) => {
  if (!Number.isInteger(low) || !Number.isInteger(high) || low > high) {
    throw new Error(`bad range: ${low}..${high}`);
  }
  return Array.from({ length: high - low + 1 }, (_, i) => low + i)
    .filter((m) => !whiteOnly || !isBlack(m));
};

// mode: 'exact' (default) or 'pitchClass'.
const matches = (target, guess, mode = 'exact') => {
  if (mode === 'exact') return target === guess;
  if (mode === 'pitchClass') return pitchClass(guess - target) === 0;
  throw new Error(`unknown match mode: ${mode}`);
};

// ---- game.js ----
// Pure game logic: state machine, scoring, stats. No DOM, no Web Audio.
// Each action takes a state and returns { state, effects }. It does not
// change the input state. The UI executes the effects.
// Effects:
//   { type: 'play', midi, delay }   delay in seconds from now
//   { type: 'show', result }        result = { correct, target, guess }

const IDLE = 'IDLE';
const AWAITING_GUESS = 'AWAITING_GUESS';
const ANSWERED = 'ANSWERED';

// Seconds between the guess and the correct note after a wrong answer.
const WRONG_TARGET_DELAY = 0.8;
// Seconds between the reference tone and the target.
const REFERENCE_DELAY = 1;

// Deterministic RNG (mulberry32). Returns floats in [0, 1).
const seededRng = (seed) => {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

// ---- stats ----

// Persistent stats. Plain data, safe for JSON.
//   notes[target]             = { attempts, correct }
//   confusions[target][guess] = count of wrong answers
const emptyStats = () => ({ notes: {}, confusions: {} });

const recordAnswer = (stats, target, guess, correct) => {
  const prev = stats.notes[target] || { attempts: 0, correct: 0 };
  const notes = {
    ...stats.notes,
    [target]: { attempts: prev.attempts + 1, correct: prev.correct + (correct ? 1 : 0) },
  };
  if (correct) return { ...stats, notes };
  const row = stats.confusions[target] || {};
  const confusions = {
    ...stats.confusions,
    [target]: { ...row, [guess]: (row[guess] || 0) + 1 },
  };
  return { notes, confusions };
};

// Notes sorted by accuracy, lowest first. Ties: more attempts first.
const weakestNotes = (stats, limit = 5) =>
  Object.entries(stats.notes)
    .filter(([, s]) => s.attempts > 0)
    .map(([m, s]) => ({ midi: Number(m), ...s, accuracy: s.correct / s.attempts }))
    .sort((a, b) => a.accuracy - b.accuracy || b.attempts - a.attempts || a.midi - b.midi)
    .slice(0, limit);

// Confusions sorted by count, highest first.
const topConfusions = (stats, limit = 5) =>
  Object.entries(stats.confusions)
    .flatMap(([t, row]) =>
      Object.entries(row).map(([g, count]) => ({ target: Number(t), guess: Number(g), count })))
    .sort((a, b) => b.count - a.count || a.target - b.target || a.guess - b.guess)
    .slice(0, limit);

// ---- state ----

const DEFAULT_CONFIG = {
  noteSet: [],
  octaveMode: 'exact',
  playTargetOnWrong: true,
  referenceNote: null, // MIDI number, or null for off
  rng: Math.random,
};

const emptySession = () => ({ correct: 0, total: 0, streak: 0 });

const createGame = ({ stats = emptyStats(), ...config } = {}) => ({
  phase: IDLE,
  config: { ...DEFAULT_CONFIG, ...config },
  target: null,
  guess: null,
  result: null,
  session: emptySession(),
  stats,
});

// Settings take effect at once. A new note set applies from the next target.
const configure = (state, patch) => ({ ...state, config: { ...state.config, ...patch } });

// Uniform pick from noteSet. Never returns prev when another note exists.
const pickTarget = (noteSet, prev, rng) => {
  if (noteSet.length === 0) throw new Error('empty note set');
  const pool = noteSet.length > 1 ? noteSet.filter((m) => m !== prev) : noteSet;
  return pool[Math.floor(rng() * pool.length)];
};

const requirePhase = (state, action, ...phases) => {
  if (!phases.includes(state.phase)) {
    throw new Error(`${action}() is not allowed in ${state.phase}`);
  }
};

const play = (midi, delay = 0) => ({ type: 'play', midi, delay });

const targetEffects = ({ config, target }) =>
  config.referenceNote === null
    ? [play(target)]
    : [play(config.referenceNote), play(target, REFERENCE_DELAY)];

const newRound = (state) => {
  const { noteSet, rng } = state.config;
  const target = pickTarget(noteSet, state.target, rng);
  const round = { ...state, phase: AWAITING_GUESS, target, guess: null, result: null };
  return { state: round, effects: targetEffects(round) };
};

const start = (state) => {
  requirePhase(state, 'start', IDLE);
  return newRound(state);
};

const next = (state) => {
  requirePhase(state, 'next', ANSWERED);
  return newRound(state);
};

// Replays the target, with the reference tone when it is on.
const replayTarget = (state) => {
  requirePhase(state, 'replayTarget', AWAITING_GUESS, ANSWERED);
  return { state, effects: targetEffects(state) };
};

// The first and only scored guess of the round.
const guess = (state, midi) => {
  requirePhase(state, 'guess', AWAITING_GUESS);
  const { noteSet, octaveMode, playTargetOnWrong } = state.config;
  if (!noteSet.includes(midi)) throw new Error(`guess ${midi} is not in the note set`);
  const { target, session } = state;
  const correct = matches(target, midi, octaveMode);
  const result = { correct, target, guess: midi };
  const answered = {
    ...state,
    phase: ANSWERED,
    guess: midi,
    result,
    session: {
      correct: session.correct + (correct ? 1 : 0),
      total: session.total + 1,
      streak: correct ? session.streak + 1 : 0,
    },
    stats: recordAnswer(state.stats, target, midi, correct),
  };
  const effects = [
    play(midi),
    ...(!correct && playTargetOnWrong ? [play(target, WRONG_TARGET_DELAY)] : []),
    { type: 'show', result },
  ];
  return { state: answered, effects };
};

const replayGuess = (state) => {
  requirePhase(state, 'replayGuess', ANSWERED);
  return { state, effects: [play(state.guess)] };
};

// Plays any note after the answer. Never scored. The note can be outside the set.
const explore = (state, midi) => {
  requirePhase(state, 'explore', ANSWERED);
  return { state, effects: [play(midi)] };
};

const resetSession = (state) => ({ ...state, session: emptySession() });

const resetStats = (state) => ({ ...state, stats: emptyStats() });

// ---- audio.js ----
// Web Audio synth. Browser-only at run time.
// createSynth() takes an AudioContext, so tests can give it a fake one.
// The UI uses the module functions: ensureAudio() inside a user gesture,
// then playNote(), stopAll(), setVoice().

const VOICES = ['piano-ish', 'sine', 'triangle'];

const MASTER_GAIN = 0.3;
const ATTACK = 0.005; // s, linear attack
const DECAY = 1.2; // s, time for the fundamental to reach SILENCE
const SILENCE = 0.0001; // exponential ramps cannot start or end at 0
const RELEASE_TC = 0.03; // s, time constant of an early release
const RELEASE_END = 8 * RELEASE_TC; // after 8 time constants the level is below 0.04 %
const PARTIALS = 6;
const NYQUIST_MARGIN = 0.9; // drop partials above 90 % of the Nyquist frequency

// The partials of one voice: [{ ratio, amp, decay, type }].
// The amplitudes add up to 1, so one note never peaks above 1.
const partials = (voice) => {
  if (voice === 'sine' || voice === 'triangle') {
    return [{ ratio: 1, amp: 1, decay: DECAY, type: voice }];
  }
  if (voice !== 'piano-ish') throw new Error(`unknown voice: ${voice}`);
  // Amplitude 1/n^1.5. Higher partials decay sooner.
  const raw = Array.from({ length: PARTIALS }, (_, i) => i + 1).map((n) => ({
    ratio: n,
    amp: 1 / n ** 1.5,
    decay: DECAY / (1 + 0.4 * (n - 1)),
    type: 'sine',
  }));
  const sum = raw.reduce((s, p) => s + p.amp, 0);
  return raw.map((p) => ({ ...p, amp: p.amp / sum }));
};

// Transfer curve over the input range [-1, 1]. Linear for |x| <= KNEE.
// Above KNEE, a tanh curve that approaches 1. Input beyond ±1 gives the end values.
const KNEE = 0.5;
const CURVE_POINTS = 2049; // odd, so that x = 0 is a point
const softClip = (x) => {
  const a = Math.abs(x);
  if (a <= KNEE) return x;
  return Math.sign(x) * (KNEE + (1 - KNEE) * Math.tanh((a - KNEE) / (1 - KNEE)));
};
const softClipCurve = () =>
  Float32Array.from({ length: CURVE_POINTS }, (_, i) => softClip((2 * i) / (CURVE_POINTS - 1) - 1));

const createSynth =(ctx, { voice = 'piano-ish' } = {}) => {
  partials(voice); // validate
  let current = voice;
  const live = new Set();

  // A soft clipper after the master gain. It stops hard clipping when many
  // notes overlap. Do not use a DynamicsCompressorNode here: in Chrome it
  // softens each note onset for about 100 ms.
  const limiter = ctx.createWaveShaper();
  limiter.curve = softClipCurve();
  const master = ctx.createGain();
  master.gain.value = MASTER_GAIN;
  master.connect(limiter);
  limiter.connect(ctx.destination);

  // when: seconds from now. duration: seconds, or null for the natural decay.
  // Returns a handle with stop(), which releases the note early.
  const playNote = (midi, { duration = null, when = 0 } = {}) => {
    const t0 = ctx.currentTime + Math.max(0, when);
    const freq = midiToFreq(midi);
    const ps = partials(current)
      .filter((p) => freq * p.ratio < (ctx.sampleRate / 2) * NYQUIST_MARGIN);

    // The release stage. Its gain stays at 1 until a release.
    const out = ctx.createGain();
    out.connect(master);
    const nodes = [out];

    const oscs = ps.map((p) => {
      const osc = ctx.createOscillator();
      osc.type = p.type;
      osc.frequency.value = freq * p.ratio;
      const env = ctx.createGain();
      env.gain.setValueAtTime(SILENCE, t0);
      env.gain.linearRampToValueAtTime(p.amp, t0 + ATTACK);
      env.gain.exponentialRampToValueAtTime(SILENCE, t0 + ATTACK + p.decay);
      osc.connect(env);
      env.connect(out);
      nodes.push(osc, env);
      return osc;
    });

    let end = t0 + ATTACK + Math.max(0, ...ps.map((p) => p.decay));
    if (duration !== null && t0 + duration < end) {
      out.gain.setTargetAtTime(0, t0 + duration, RELEASE_TC);
      end = t0 + duration + RELEASE_END;
    }

    const note = {
      midi,
      stop: () => {
        const now = ctx.currentTime;
        if (now >= end) return;
        out.gain.cancelScheduledValues(now);
        out.gain.setValueAtTime(out.gain.value, now);
        out.gain.setTargetAtTime(0, now, RELEASE_TC);
        end = Math.min(end, now + RELEASE_END);
        oscs.forEach((o) => o.stop(end));
      },
    };

    const cleanup = () => {
      nodes.forEach((n) => n.disconnect());
      live.delete(note);
    };
    if (oscs.length === 0) {
      cleanup();
      return note;
    }
    oscs.forEach((o) => {
      o.start(t0);
      o.stop(end);
    });
    // All oscillators stop at the same time.
    oscs[0].onended = cleanup;
    live.add(note);
    return note;
  };

  const stopAll = () => [...live].forEach((n) => n.stop());

  const setVoice = (v) => {
    partials(v); // validate
    current = v;
  };

  return { playNote, stopAll, setVoice, voice: () => current, liveCount: () => live.size };
};

// ---- browser singleton ----

let audioCtx = null;
let synth = null;
let pendingVoice = 'piano-ish';

// Call only inside a user gesture (autoplay policy). Resolves to the synth.
const ensureAudio = () => {
  if (!synth) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    synth = createSynth(audioCtx, { voice: pendingVoice });
  }
  return audioCtx.state === 'suspended'
    ? audioCtx.resume().then(() => synth)
    : Promise.resolve(synth);
};

const audioReady = () => synth !== null;

const playNote = (midi, opts) => {
  if (!synth) throw new Error('audio is not started: call ensureAudio() first');
  return synth.playNote(midi, opts);
};

const stopAll = () => {
  if (synth) synth.stopAll();
};

const setVoice = (v) => {
  partials(v); // validate
  pendingVoice = v;
  if (synth) synth.setVoice(v);
};

// ---- ui.js ----
// DOM wiring. Phase 1: placeholder that proves the bundled script runs.
// Phase 3: a hidden audio debug section. Open the page with ?debug to show it.

const LOW = 60;
const HIGH = 84;

const names = (whiteOnly) => {
  const showOctave = spansOctaves(LOW, HIGH);
  return buildNoteSet({ low: LOW, high: HIGH, whiteOnly })
    .map((m) => noteName(m, { style: 'central', showOctave }))
    .join(' ');
};

const renderPlaceholder = () => {
  const el = document.getElementById('app');
  el.textContent = `Default note set (white keys): ${names(true)}`;
  const chromatic = document.createElement('p');
  chromatic.textContent = `With black keys: ${names(false)}`;
  el.after(chromatic);
};

// ---- audio debug section ----

// Each sound is a list of [midi, when, duration] for playNote.
const DEBUG_SOUNDS = [
  ['C major chord', [[60, 0], [64, 0], [67, 0]]],
  ['Arpeggio C–E–G–C', [[60, 0], [64, 0.15], [67, 0.3], [72, 0.45]]],
  ['Cluster C4–H4 (7 notes)', [60, 62, 64, 65, 67, 69, 71].map((m) => [m, 0])],
  ['Repeat C4 ×8 fast', Array.from({ length: 8 }, (_, i) => [60, i * 0.1])],
  ['A4 short (0.2 s)', [[69, 0, 0.2]]],
  ['A4 ×4 (tuner)', Array.from({ length: 4 }, (_, i) => [69, i * 1])],
  ['C4 and C6', [[60, 0], [84, 0]]],
];

const button = (label, onClick) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = label;
  b.addEventListener('click', onClick);
  return b;
};

const setupDebug = () => {
  if (!new URLSearchParams(location.search).has('debug')) return;
  const section = document.getElementById('debug');
  const state = document.getElementById('debug-state');
  section.hidden = false;

  // ensureAudio() runs inside the click handler, as the autoplay policy requires.
  const withAudio = (fn) => () =>
    ensureAudio()
      .then(() => {
        state.textContent = 'audio: running';
        fn();
      })
      .catch((err) => {
        state.textContent = `audio error: ${err.message}`;
      });

  const select = document.getElementById('debug-voice');
  VOICES.forEach((v) => select.add(new Option(v, v)));
  select.addEventListener('change', () => setVoice(select.value));

  document.getElementById('debug-stop').addEventListener('click', () => stopAll());

  const notes = document.getElementById('debug-notes');
  buildNoteSet({ low: 60, high: 72, whiteOnly: false }).forEach((m) => {
    const label = noteName(m, { style: 'central', showOctave: true });
    notes.append(button(label, withAudio(() => playNote(m))));
  });

  const extra = document.getElementById('debug-extra');
  DEBUG_SOUNDS.forEach(([label, events]) => {
    extra.append(button(label, withAudio(() =>
      events.forEach(([m, when, duration = null]) => playNote(m, { when, duration })))));
  });
};

renderPlaceholder();
setupDebug();

})();
</script>
</body>
</html>

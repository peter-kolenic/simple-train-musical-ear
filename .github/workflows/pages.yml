# Test, build, and publish dist/ear-trainer.html to GitHub Pages.
# The page is served as both index.html and ear-trainer.html.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A new push does not cancel a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26' # the same as mise.toml
      - run: npm test
      - run: npm run build
      - name: Prepare the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp dist/ear-trainer.html _site/ear-trainer.html
          cp dist/ear-trainer.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
